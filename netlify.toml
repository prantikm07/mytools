# ── prymo ToolBox — Netlify configuration ─────────────────────────────
# Pure static website on Netlify: React SPA (frontend/dist) + Netlify
# Functions for the few tools that need server-side code (/api/*).
#
#   • Image & PDF tools run 100% client-side in the browser (WebAssembly).
#   • QR/Barcode generation is served by netlify/functions/api.mjs.
#   • Video→Audio and Transcription optionally proxy to a free self-hosted
#     FastAPI backend when the env var PRYMO_API_URL is set (see README).
#   • Set VITE_API_URL at build time only if you want ALL /api traffic to
#     go straight to that backend, bypassing the functions.

[build]
  base    = "frontend"          # project root for npm (package.json lives here)
  command = "npm run build"     # netlify.toml [functions] auto-runs `npm install` there
  publish = "dist"              # plain static SPA output — always exists, no 404s
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# When VITE_API_URL is configured at build time, the SPA calls the remote
# backend directly (absolute URLs), so this rewrite is not used.
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/docs"
  to   = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
